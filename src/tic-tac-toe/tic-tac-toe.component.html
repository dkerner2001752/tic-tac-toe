<h3 class="header-container">Good luck</h3>
<div class="tic-tac-toe-container" *ngIf="ticTacToeFormGroup" [formGroup]="ticTacToeFormGroup">
  <div *ngFor="let formControl of ticTacToeFormGroup.controls.values.controls; index as i">
    <button class="button-item" (click)="onButtonClick(i)">{{ formControl.value }}</button>
  </div>
</div>
<div class="button-container">
  <button (click)="navigateToHome()">Home</button>
  <button (click)="playAgain()">Play Again</button>
</div>
